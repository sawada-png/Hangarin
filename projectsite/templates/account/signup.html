<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Hangarin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .signup-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 58px;
            height: 58px;
            background: #212529;
            color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #212529;
        }

        .subtitle {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .btn-signup {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        .login-link {
            color: #6c757d;
            text-decoration: none;
        }

        .login-link:hover {
            color: #212529;
        }

        .errorlist {
            color: #dc3545;
            font-size: 14px;
            padding-left: 20px;
            margin-top: 5px;
        }

    </style>

</head>

<body>

<div class="container px-3">

    <div class="signup-card mx-auto">

        <div class="text-center">

            <div class="logo">
                H
            </div>

            <h1 class="title">
                Create your account
            </h1>

            <p class="subtitle">
                Start managing your tasks with Hangarin
            </p>

        </div>

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {{ field.errors }}

                </div>

            {% endfor %}

            <button
                type="submit"
                class="btn btn-dark w-100 btn-signup"
            >
                Create Account
            </button>

        </form>

        <div class="text-center mt-4">

            <span class="text-muted">
                Already have an account?
            </span>

            <a
                href="{% url 'account_login' %}"
                class="login-link fw-semibold"
            >
                Sign In
            </a>

        </div>

    </div>

</div>

</body>

</html>
