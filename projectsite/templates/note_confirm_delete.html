note_confirm_delete.html{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-header">
            <h3>Delete Note</h3>
        </div>

        <div class="card-body">

            <h5>Are you sure you want to delete this note?</h5>

            <p class="mt-3">
                <strong>{{ object.content }}</strong>
            </p>

            <p class="text-muted">
                This action cannot be undone.
            </p>

            <form method="post">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">
                    Confirm Delete
                </button>

                <a href="{% url 'note-list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
