{% load widget_tweaks %}

{% if form.non_field_errors %}

<div class="alert alert-danger">

    {% for error in form.non_field_errors %}
        <p class="mb-0">
            {{ error }}
        </p>
    {% endfor %}

</div>

{% endif %}


{% for field in form %}

<div class="mb-3">

    <label class="form-label">
        {{ field.label }}
    </label>

    {% render_field field %}

    {% for error in field.errors %}

    <div class="text-danger small mt-1">
        {{ error }}
    </div>

    {% endfor %}

</div>

{% endfor %}
