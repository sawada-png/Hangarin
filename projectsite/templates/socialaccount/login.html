<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Continue - Hangarin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 58px;
            height: 58px;
            background: #212529;
            color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .hangarin-title {
            font-size: 28px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6c757d;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .continue-btn {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        .cancel-link {
            display: block;
            margin-top: 18px;
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
        }

        .cancel-link:hover {
            color: #212529;
        }

        .signup-text {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
            color: #6c757d;
            font-size: 14px;
        }

        .signup-link {
            color: #212529;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        .account-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 25px;
            color: #495057;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="container px-3">

    <div class="login-card mx-auto text-center">

        <div class="logo">
            H
        </div>

        <div class="hangarin-title">
            Hangarin
        </div>

        <p class="subtitle">
            Continue with your social account
        </p>

        <div class="account-info">
            You are about to sign in using your social account.
        </div>

        <h5 class="mb-3">
            Continue Sign In
        </h5>

        <p class="text-muted mb-4">
            Continue to authenticate with your account.
        </p>

        <form method="post">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-dark w-100 continue-btn"
            >
                Continue
            </button>

        </form>

        <a
            href="{% url 'account_login' %}"
            class="cancel-link"
        >
            Cancel and return to login
        </a>

        <div class="signup-text">

            Don't have a Hangarin account?

            <a
                href="{% url 'account_signup' %}"
                class="signup-link"
            >
                Sign Up
            </a>

        </div>

    </div>

</div>

</body>

</html>
