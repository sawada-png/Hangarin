{% extends "base.html" %}

{% block title %}
Hangarin - Add Task
{% endblock %}

{% block content %}

<div class="mb-4">

    <h1>Add Task</h1>

    <p class="text-muted">
        Create a new task.
    </p>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <form method="post" novalidate>

            {% csrf_token %}

            {% include "includes/form.html" %}

            <div class="mt-3">

                <button type="submit" class="btn btn-primary">
                    Add Task
                </button>

                <a href="{% url 'task-list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
